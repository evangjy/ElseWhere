<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ABandOn</title>
<style>
:root{--ink:#161b26;--ink2:#222a3a;--line:#2f384c;--paper:#f6f3ec;--fg:#e9e4d9;--mute:#8d96a8;--acc:#ff7a59}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;font:13px -apple-system,"PingFang SC",sans-serif;background:var(--ink);color:var(--fg);-webkit-user-select:none}
header,.edit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px}
header{border-bottom:1px solid var(--line)} .edit{background:var(--ink2);border-bottom:1px solid var(--line);padding:6px 14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:.3px;margin-right:8px}
.brand i{width:11px;height:11px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px #ff7a5988}
.g{display:flex;gap:4px;align-items:center;padding-right:10px;margin-right:4px;border-right:1px solid var(--line)} .g:last-child{border:0}
button,select,input[type=number]{font:inherit;color:var(--fg);background:#2b3448;border:1px solid transparent;border-radius:7px;padding:4px 10px;outline:0}
button{cursor:pointer} button:hover{background:#364059} button.on{background:var(--acc);color:#1a1210}
button:disabled{opacity:.35} .pp{width:44px;background:var(--acc);color:#1a1210;font-weight:700}
input[type=number]{width:62px} select{padding:4px 6px} .lbl{color:var(--mute);font-size:12px}
#time{font-variant-numeric:tabular-nums;color:var(--mute);min-width:92px}
#title{margin-left:auto;color:var(--mute)}
#body{flex:1;display:flex;min-height:0}
#main{flex:1;overflow:auto;background:#2a2f3b;padding:20px}
#wrap{position:relative;background:var(--paper);color:#111;border-radius:6px;padding:16px;min-height:100%;box-shadow:0 8px 30px #0006}
#sel{position:absolute;display:none;background:#ff7a5928;border:1px solid var(--acc);border-radius:3px;pointer-events:none;z-index:5}
#mixer{width:230px;background:var(--ink2);border-left:1px solid var(--line);padding:10px;overflow:auto;display:none}
#mixer.show{display:block} .tr{padding:8px 4px;border-bottom:1px solid var(--line)} .tr b{cursor:pointer;display:block;margin-bottom:6px;font-weight:500}
.tr.cur b{color:var(--acc)} .tr input[type=range]{width:100%;accent-color:var(--acc);margin-top:6px} .tr button{padding:1px 8px;font-size:12px}
footer{padding:6px 14px;border-top:1px solid var(--line);color:var(--mute);font-size:12px;display:flex;gap:16px}
.at-cursor-bar{background:#ff7a5922!important}.at-cursor-beat{background:var(--acc)!important;width:3px!important}
.at-selection div{background:#ff7a5933!important}.at-highlight *{fill:var(--acc)!important;stroke:var(--acc)!important}

body{padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left);-webkit-touch-callout:none;touch-action:manipulation}
header{padding-top:calc(8px + env(safe-area-inset-top))} footer{padding-bottom:calc(6px + env(safe-area-inset-bottom))}
#main{touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
#dock{display:none;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px;background:var(--ink2);border-top:1px solid var(--line)}
#dock.show{display:flex} #dock .g{border:0;padding:0;margin:0 8px 0 0} #dock button{min-width:46px;min-height:46px;font-size:17px;font-weight:600}
#dock button[data-k]{font-size:14px} #ds{margin-left:auto;color:var(--mute);font-size:13px}
@media (pointer:coarse){
 button,select,input[type=number]{min-height:42px;padding:8px 14px;font-size:15px;border-radius:9px}
 .pp{width:56px} header,.edit{gap:8px} .edit{overflow-x:auto;flex-wrap:nowrap;white-space:nowrap}
 #mixer{width:260px} .tr button{min-height:34px;padding:4px 14px} footer span:last-child{display:none} .lbl{font-size:13px}
}
#lib{width:260px;background:var(--ink2);border-right:1px solid var(--line);display:none;flex-direction:column}
#lib.show{display:flex} #lib .top{display:flex;gap:6px;padding:10px;align-items:center} #lib .top b{margin-right:auto;font-weight:600}
#libp{padding:0 12px 8px;color:var(--mute);font-size:12px} #libp a{cursor:pointer;color:var(--fg)}
#libl{flex:1;overflow:auto} .li{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;border-top:1px solid var(--line)}
.li:hover{background:#2b3448} .li.cur{background:#3a2a27} .li .ic{color:var(--acc);width:14px;text-align:center}
.li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .li .mo{padding:0 10px;background:none;min-height:30px}
.em{padding:16px;color:var(--mute);font-size:12px;line-height:1.7}
#sheet{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50}
#sheet .box{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:270px;max-height:70vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
#sheet .box b{padding:4px 6px;color:var(--mute);font-weight:500}
#pdf{display:none;width:100%;height:calc(100vh - 190px);border:0;background:#fff;border-radius:6px}
@media (pointer:coarse){.li{min-height:48px}}
/* 资料库：改为顶栏下拉菜单，不占版面 */
#lib{position:fixed;top:calc(56px + env(safe-area-inset-top));left:14px;width:360px;max-height:68vh;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 44px #000b;z-index:40}
#lib #libl{max-height:calc(68vh - 110px)}
/* 启动页（iPad 打开即选谱） */
#home{position:fixed;inset:0;background:var(--ink);z-index:60;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#home.show{display:flex} #home .hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:24px 28px 8px}
.brand.big{font-size:28px;margin-right:auto} .brand.big i{width:16px;height:16px}
#home .hb{flex:1;overflow:auto;padding:0 28px 32px} #home .sec{margin:22px 0 8px;color:var(--mute);font-size:13px;letter-spacing:.5px}
.crumb{color:var(--mute);margin-bottom:12px} .crumb a{cursor:pointer;color:var(--fg)}
.grid,#rec{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.grid .li,#rec .li{border:1px solid var(--line);border-radius:12px;min-height:76px;background:var(--ink2);padding:14px}
#rec .li small{display:block;color:var(--mute);font-size:11px;margin-top:3px}
/* 调音台改为下拉面板 */
#mixer{position:fixed;top:calc(56px + env(safe-area-inset-top));right:14px;width:350px;max-height:72vh;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 44px #000b;z-index:40;padding:6px 14px 12px}
.mh{padding:8px 0;font-weight:600;color:var(--mute)} .mrow{display:flex;align-items:center;gap:8px} .mrow input,.tr>input{flex:1}
.pc{min-width:44px;text-align:right;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.tr>input{width:calc(100% - 52px);vertical-align:middle}
select.sort{padding:3px 6px;font-size:12px} #lib .top{flex-wrap:wrap}
.li .nm small{display:block;color:var(--mute);font-size:11px;margin-top:2px}
#sheet .form{min-width:320px} #sheet .form label{display:flex;flex-direction:column;gap:4px;color:var(--mute);font-size:12px}
#sheet .form input[type=text],#sheet .form select{width:100%;font:inherit;color:var(--fg);background:#2b3448;border:1px solid var(--line);border-radius:8px;padding:8px 10px;-webkit-user-select:text}
#sheet .row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
#cell{position:absolute;display:none;background:#ff7a5944;border:1.5px solid var(--acc);border-radius:3px;pointer-events:none;z-index:6}
#recp{position:fixed;top:calc(56px + env(safe-area-inset-top));right:14px;width:360px;background:var(--ink2);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 44px #000b;z-index:40;padding:6px 14px 14px;display:none}
#recp.show{display:block} .rrow{display:flex;align-items:center;gap:10px;margin:10px 0} .rrow .lbl{min-width:84px} .rrow select,.rrow input[type=number]{flex:1;min-width:0}
#meter{flex:1;height:10px;background:#2b3448;border-radius:5px;overflow:hidden} #meter i{display:block;height:100%;width:0;background:#4cc38a;transition:width .05s} #meter i.clip{background:#ff4d4d}
button.rec{flex:1;min-height:44px;font-weight:700;background:#8a2f2f;color:#fff} button.rec.on{background:#ff4d4d} #rtime{font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
#rmsg{color:var(--mute);font-size:12px;line-height:1.6} .chk{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:12px}
#aud{display:none;padding:40px 0;text-align:center} #aud audio{width:90%;max-width:640px}
#sheet .row.wrap{flex-wrap:wrap} #sheet .box .em{padding:4px 6px;font-size:12px}
.barsel{position:absolute;background:#ff7a5922;border-bottom:3px solid var(--acc);pointer-events:none;z-index:4}
#sheet .xbox{overflow:visible;max-height:none;min-width:360px} .xrow{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12px} .xrow .lbl{min-width:84px;color:var(--fg)}
.xrow select{flex:1;min-width:0} .xrow input[type=number]{width:64px;min-height:34px;padding:4px 8px}
.mths{display:flex;gap:8px;margin:4px 0} .mth{position:relative;flex:1;padding:10px 10px 8px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#2b3448;display:flex;flex-direction:column;gap:2px}
.mth.on{border-color:var(--acc);background:#3a2a27} .mth .n{font-weight:600;color:var(--fg);font-size:13px} .mth .d{font-size:11px;color:var(--mute)}
.mth .i{position:absolute;top:4px;right:6px;font-size:14px;color:var(--mute);cursor:help;padding:2px 4px;line-height:1} .mth .i:hover,.mth .i.open{color:var(--acc)}
.mth .tip{display:none;position:absolute;left:0;top:calc(100% + 6px);width:280px;max-width:80vw;background:#10141d;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.65;color:var(--fg);z-index:80;box-shadow:0 10px 30px #000a;text-align:left}
.mth:nth-child(3) .tip{left:auto;right:0} .mth .i:hover~.tip,.mth .i.open~.tip{display:block}
.chks{display:flex;flex-direction:column;gap:4px;max-height:150px;overflow:auto;padding:2px 0} #sheet .chks label{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:13px}
#pvbar{position:fixed;left:50%;bottom:calc(48px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;flex-direction:column;gap:8px;background:var(--ink2);border:1px solid var(--acc);border-radius:14px;padding:10px 14px;z-index:46;box-shadow:0 12px 40px #000b;max-width:min(92vw,720px)}
#pvbar.show{display:flex} #pvbar .pvt{display:flex;flex-direction:column;gap:3px} #pvbar .pvt span{color:var(--mute);font-size:12px;line-height:1.5}
#pvbar .pvb{display:flex;gap:8px;align-items:center;flex-wrap:wrap} #pvbar label{color:var(--mute);font-size:12px;display:flex;align-items:center;gap:6px}
.tr button[data-del]{margin-left:auto;background:#4a2a2a} .tr button[data-del]:hover{background:#7a3030}
@media (pointer:coarse){#pvbar{bottom:calc(170px + env(safe-area-inset-bottom))}}
.gone{display:none!important} .mac .hm{display:none!important}
#trkw{position:relative;display:inline-block} #trkbtn{min-width:120px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
#trkmenu{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:240px;max-height:60vh;overflow:auto;background:var(--ink2);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 44px #000b;z-index:45;padding:4px}
#trkmenu.show{display:block} .trk-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 10px;border-radius:8px;cursor:pointer;min-height:36px} .trk-row:hover{background:#2f394f} .trk-row.cur .trk-n{color:var(--acc)}
.trk-x{color:#ff5a5a;font-weight:700;font-size:13px;line-height:1;padding:5px 8px;border-radius:6px} .trk-x:hover{background:#ff5a5a33}
#zin{width:62px;text-align:right}

/* ===== 统一布局：菜单条（iPad）/ 常用功能行 / 创作工具行（符号）===== */
#hmbox{display:none}
header{padding-top:8px!important}
#menubar{display:flex;align-items:center;gap:2px;padding:4px 12px;padding-top:calc(4px + env(safe-area-inset-top));background:#10141d;border-bottom:1px solid var(--line);position:relative;z-index:60}
#menubar .brand{margin-right:10px} .mac #menubar{display:none}
.mn{position:relative} .mnb{background:none;padding:5px 12px} .mn.open .mnb{background:#2b3448}
.mnl{display:none;position:absolute;top:calc(100% + 4px);left:0;min-width:190px;background:var(--ink2);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px #000b;padding:4px;z-index:80}
.mn.open .mnl{display:block} .mnl div{padding:9px 12px;border-radius:7px;cursor:pointer;white-space:nowrap} .mnl div:hover{background:#2f394f} .mnl hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.edit{flex-wrap:wrap!important;overflow:visible!important;white-space:normal!important}
.edit button{width:38px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:8px}
.edit button .ic{width:22px;height:22px;display:block;pointer-events:none}
#tbw{position:relative} #tbpos{width:38px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center} #tbpos .ic{width:22px;height:22px}
#tbmenu{display:none;position:absolute;top:calc(100% + 6px);right:0;min-width:170px;background:var(--ink2);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px #000b;padding:4px;z-index:80}
#tbmenu.show{display:block} #tbmenu div{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;cursor:pointer;white-space:nowrap} #tbmenu div:hover{background:#2f394f} #tbmenu .ic{width:20px;height:20px} #tbmenu div.cur{color:var(--acc)}
body.tools-hide .edit{display:none}
body.tools-left .edit{flex-direction:column;flex-wrap:nowrap!important;width:62px;flex:0 0 62px;padding:8px 8px;overflow-y:auto!important;overflow-x:hidden!important;border-bottom:0;border-right:1px solid var(--line);gap:2px;align-items:center}
body.tools-left .edit .g{flex-direction:column;border-right:0;border-bottom:1px solid var(--line);padding:0 0 6px;margin:0 0 6px;width:100%;align-items:center;gap:3px}
body.tools-left .edit .g:last-child{border-bottom:0}
#trkmenu{min-width:280px} .trk-top{display:flex;gap:6px;padding:4px 6px 8px;border-bottom:1px solid var(--line);margin-bottom:4px} .trk-top button{font-size:12px;padding:4px 10px}
.trk-row .trk-c{width:18px;height:18px;accent-color:var(--acc);flex:0 0 auto;margin:0} .trk-row .trk-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .trk-row small{color:var(--acc);font-size:10px;margin-left:6px}
.trk-row{justify-content:flex-start!important}
@media (pointer:coarse){.edit button,#tbpos{width:44px;height:42px}.mnb{padding:8px 14px}.trk-row{min-height:44px}}
</style></head><body>

<script>/* 内录：仅在录音时才把 ScriptProcessor 接入音频输出（平时不增加任何音频处理，避免影响播放音质） */
(()=>{const oc=AudioNode.prototype.connect;window.__bk={on:false,chunks:[],rate:44100};window.__tapSrc=null;
AudioNode.prototype.connect=function(d,...a){const r=oc.call(this,d,...a);
 try{if(window.AudioDestinationNode&&d instanceof AudioDestinationNode&&!window.__tapSrc){window.__tapSrc={node:this,dest:d,ctx:d.context,sp:null,g:null};window.__bk.rate=d.context.sampleRate}}catch(e){}
 return r};
window.__tapStart=()=>{const t=window.__tapSrc;if(!t||t.sp)return;try{const c=t.ctx;t.sp=c.createScriptProcessor(4096,2,2);t.g=c.createGain();t.g.gain.value=0;
 t.sp.onaudioprocess=e=>{if(window.__bk.on){const b=e.inputBuffer,L=b.getChannelData(0),R=b.numberOfChannels>1?b.getChannelData(1):L;window.__bk.chunks.push([L.slice(),R.slice()])}};
 oc.call(t.node,t.sp);oc.call(t.sp,t.g);oc.call(t.g,t.dest)}catch(e){}};
window.__tapStop=()=>{const t=window.__tapSrc;if(!t||!t.sp)return;try{t.node.disconnect(t.sp)}catch(e){}try{t.sp.disconnect();t.g.disconnect()}catch(e){}t.sp=null;t.g=null}})();
</script>

<script>

  one=(e,tag)=>kids(e,tag)[0]||null,txt=(e,tag,d)=>{const x=one(e,tag);return x?x.textContent.trim():(d===undefined?'':d)},
  desc=(e,tag)=>{const l=e.getElementsByTagName(tag),o=[];for(let i=0;i<l.length;i++)o.push(l[i]);return o};

   vol=ch?kids(ch,'controller').find(c=>c.getAttribute('ctrl')==='7'):null,sd=inst?one(inst,'StringData'):null,

  let ch=0;while(channelsUsed.has(ch)||channelsUsed.has(ch+1)||ch===8||ch===9)ch+=2;channelsUsed.add(ch);channelsUsed.add(ch+1);t.playbackInfo.primaryChannel=ch;t.playbackInfo.secondaryChannel=ch+1;
  const T=p.strings&&p.strings.length>=4?p.strings:null;
  t.staves.forEach((st,si)=>{const ms=meas[sids[si]];st.showStandardNotation=true;st.showTablature=!!T;
   if(T)st.stringTuning=new M.Tuning('',T,T.join()==='64,59,55,50,45,40');

   for(let mi=0;mi<nBars;mi++){const m=ms[mi],mb=score.masterBars[mi],bar=new M.Bar();
    const cl=m?desc(m,'Clef')[0]:null;if(cl){const ct=txt(cl,'concertClefType','')||txt(cl,'transposingClefType','');if(ct)clef=clefOf(ct)}

         if(T){let best=null;for(let k2=0;k2<T.length;k2++){const f=x.p-T[k2];if(f<0||f>24||used.has(k2))continue;const c=f+(f>12?6:0);if(!best||c<best.c)best={k2,f,c}}

/*MSCX-END*/

/*MERGE-START*/
/* 合并乐谱：把另一份乐谱（如钢琴谱）里选中的音轨并入当前乐谱，按小节对齐（可设起始小节），不足补休止、多出截断 */
const MG_RESTS=[[3840,1,0],[2880,2,1],[1920,2,0],[1440,4,1],[960,4,0],[720,8,1],[480,8,0],[360,16,1],[240,16,0],[120,32,0],[60,64,0]];
function mgRests(M,v,ticks){for(const [t,d,dots] of MG_RESTS)while(ticks>=t){const b=new M.Beat();b.isEmpty=false;b.duration=d;b.dots=dots;v.addBeat(b);ticks-=t}}
function mgEmptyBar(M,base,k,refStaff,maxV){const bar=new M.Bar(),rb=refStaff.bars.length?refStaff.bars[Math.min(k,refStaff.bars.length-1)]:null;
 bar.clef=rb?rb.clef:M.Clef.G2;const bb=base.tracks[0]&&base.tracks[0].staves[0].bars[k];bar.keySignature=bb?bb.keySignature:(rb?rb.keySignature:0);const mb=base.masterBars[k],v=new M.Voice();bar.addVoice(v);
 mgRests(M,v,mb.timeSignatureNumerator*3840/mb.timeSignatureDenominator);
 for(let i=1;i<maxV;i++){const v2=new M.Voice(),e=new M.Beat();e.isEmpty=true;v2.addBeat(e);bar.addVoice(v2)}return bar}
function mergeTracks(M,base,src,idxs,offset){const nb=base.masterBars.length,used=new Set();
 base.tracks.forEach(t=>{used.add(t.playbackInfo.primaryChannel);used.add(t.playbackInfo.secondaryChannel)});let added=0,trunc=0;
 idxs.forEach(i=>{const t=src.tracks[i];
  t.staves.forEach(st=>{const maxV=Math.max(1,...st.bars.map(b=>b.voices.length)),bars=[];
   for(let k=0;k<offset&&k<nb;k++)bars.push(mgEmptyBar(M,base,k,st,maxV));
   st.bars.forEach(b=>bars.push(b));
   while(bars.length<nb)bars.push(mgEmptyBar(M,base,bars.length,st,maxV));
   if(bars.length>nb)trunc+=bars.length-nb;bars.length=Math.min(bars.length,nb);
   st.bars=[];bars.forEach(b=>{b.previousBar=null;b.nextBar=null;st.addBar(b)});bars[bars.length-1].nextBar=null});
  const perc=t.staves.some(s=>s.isPercussion)||t.playbackInfo.primaryChannel===9;
  if(!perc&&(used.has(t.playbackInfo.primaryChannel)||used.has(t.playbackInfo.secondaryChannel))){let ch=0;while(used.has(ch)||used.has(ch+1)||ch===8||ch===9)ch+=2;t.playbackInfo.primaryChannel=ch;t.playbackInfo.secondaryChannel=ch+1}
  used.add(t.playbackInfo.primaryChannel);used.add(t.playbackInfo.secondaryChannel);base.addTrack(t);added++});
 return{added,trunc}}
/*MERGE-END*/

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'),sh=$('sheet'),open=h=>{sh.innerHTML=h;sh.style.display='flex'},close=()=>{sh.style.display='none'},
 EXTS=['gp','gp3','gp4','gp5','gpx','musicxml','xml','mxl','mscz','mscx'],ext=n=>n.split('.').pop().toLowerCase();
/* —— MuseScore：.mscz 是 zip（内含 .mscx），.mscx 是纯 XML —— */
window.museToScore=(bytes,e)=>{let xml;
 if(e==='mscx')xml=new TextDecoder('utf-8').decode(bytes);
 else{const files=fflate.unzipSync(bytes),name=Object.keys(files).find(k=>/\.mscx$/i.test(k));if(!name)throw new Error('压缩包里没有找到 .mscx 乐谱文件');xml=fflate.strFromU8(files[name])}
 const doc=new DOMParser().parseFromString(xml,'application/xml');if(doc.getElementsByTagName('parsererror').length)throw new Error('乐谱文件内容无法解析');
 const sc=mscxToScore(AT,doc);if(sc.__warnings&&sc.__warnings.length)setTimeout(()=>{$('status').textContent='导入提示：'+sc.__warnings.join('；')},300);return sc};
if(api.error&&api.error.on)api.error.on(e=>{alert('无法打开这个文件：'+((e&&e.message)||e))});
const parseSource=(name,bytes)=>{const e=ext(name);return(e==='mscz'||e==='mscx')?window.museToScore(bytes,e):AT.importer.ScoreLoader.loadScoreFromBytes(bytes,api.settings)};
const b2u=b64=>Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
/* —— 合并乐谱 —— */
let mg={name:'',bytes:null};
async function libScores(dir,out,depth){const items=(await window.lib('list',{path:dir}))||[];
 for(const i of items){const p=dir?dir+'/'+i.name:i.name;if(i.dir){if(depth<4)await libScores(p,out,depth+1)}else if(EXTS.includes(ext(i.name)))out.push(p)}return out}
async function openMerge(){if(!api.score)return;
 open(`<div class="box form xbox"><b>合并乐谱</b>
 <div class="em">把另一份乐谱（例如钢琴谱 .gp）里选中的音轨合并进当前乐谱，得到一份完整的合奏谱。音轨按小节号对齐加入，当前乐谱的速度和拍号保持不变；支持 .gp / .gpx / .musicxml / .mxl / .mscz。</div>

 <div class="row wrap"><button data-g="x">取消</button><button data-g="pick">从电脑选择…</button><button data-g="lib" class="on">下一步</button></div>
 <div class="em" id="mgM"></div></div>`);
 const cur=window.getCur&&window.getCur(),list=(await libScores('',[],0)).filter(p=>p!==cur);

async function useSource(name,bytes){try{const src=await parseSource(name,bytes);mg={name,bytes};step2(src)}catch(e){const m=$('mgM');if(m)m.textContent='无法读取这份乐谱：'+e.message}}

 open(`<div class="box form xbox"><b>选择要合并的音轨</b>

 <div class="chks">${src.tracks.map((t,i)=>`<label><input type="checkbox" class="mgT" value="${i}" checked> ${esc(t.name||'音轨 '+(i+1))} <span style="color:var(--mute)">${kindOf(t)} · ${cnt(t)} 个音</span></label>`).join('')}</div>

 <div class="row"><button data-g="x">取消</button><button data-g="back">返回</button><button data-g="go" class="on">合并</button></div></div>`)}
async function doMerge(){const idxs=[...sh.querySelectorAll('.mgT:checked')].map(x=>+x.value),off=Math.max(0,(parseInt($('mgO').value)||1)-1),msg=t=>$('mgM').textContent=t;
 if(!idxs.length){msg('请至少选择一个音轨');return}
 try{const src=await parseSource(mg.name,mg.bytes),sc=api.score;let mism=0;
  for(let k=0;k<src.masterBars.length&&k+off<sc.masterBars.length;k++){const a=src.masterBars[k],b=sc.masterBars[k+off];if(a.timeSignatureNumerator!==b.timeSignatureNumerator||a.timeSignatureDenominator!==b.timeSignatureDenominator)mism++}

  const depth=undoS.length,tr=ti;window.syncTracks&&window.syncTracks();
  window.showPv({title:'已合并 '+res.added+' 个音轨（来自「'+mg.name+'」）——先试听，再决定是否保留',
   detail:(res.trunc?'来源比当前乐谱长，已截去 '+res.trunc+' 个小节；':'')+(mism?'有 '+mism+' 个小节的拍号与当前乐谱不同，节奏可能错位；':'')+'放弃 = 撤销这次合并',track:tr,
   drop:()=>{if(undoS.length===depth)undo();else alert('合并之后又做了其他编辑，请用 ⌘Z 手动撤销')}})}

sh.addEventListener('click',async e=>{const g=e.target.dataset.g;if(!g)return;

  $('mgM').textContent='正在读取…';const b=await window.lib('read',{path:p});if(b&&b.err){$('mgM').textContent=b.err;return}useSource(p.split('/').pop(),b2u(b))}
 else if(g==='pick'){window.__pick=(n,b64)=>{open('<div class="box form"><b>合并乐谱</b><div class="em" id="mgM">正在读取…</div></div>');useSource(n,b2u(b64))};post({op:'open'})}});

<script>

(()=>{
